appId: com.markdownedit.app
productName: MarkdownEdit
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown Document
    mimeType: text/markdown
    role: Editor
    icon: build/icon.png
  - ext: markdown
    name: Markdown
    description: Markdown Document
    mimeType: text/markdown
    role: Editor
    icon: build/icon.png
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: qiunet
  repo: MarkDownEdit
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: MarkdownEdit
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MarkdownEdit
  differentialPackage: true
